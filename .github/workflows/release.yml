name: Release

# Publishing a GitHub release publishes the package at the version its
# `package.json` carries -- bump that first, then tag the release `v<version>`.
on:
  release:
    types: [published]

permissions:
  contents: read
  # Signs the npm provenance statement, and authenticates the publish once npm
  # trusted publishing is configured for the package.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version `packageManager` pins.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      # `prepublishOnly` runs the checks, the tests, and the build. A release
      # checks out its tag rather than a branch, which pnpm's git checks reject.
      - run: pnpm publish --no-git-checks --provenance
        env:
          # Only needed until trusted publishing is set up on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
