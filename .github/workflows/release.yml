name: Release

# Publishing a GitHub release stages the package at the version its
# `package.json` carries -- bump that first, then tag the release `v<version>`.
# The staged version goes live once approved on npmjs.com.
on:
  release:
    types: [published]

permissions:
  contents: read
  # Signs the npm provenance statement, and authenticates the staged publish
  # through npm trusted publishing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version `packageManager` pins.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      # `npm stage` needs a newer npm than Node ships.
      - run: npm install --global npm@12
      # Staged, not published: the version goes live only once it's approved on
      # npmjs.com with 2FA. `prepublishOnly` still runs the checks, the tests,
      # and the build first.
      - run: npm stage publish --provenance
